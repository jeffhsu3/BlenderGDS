name: Fancy
description: Fancy color scheme - premium tech aesthetic
layers:
  # N-well - warm amber (subtle substrate glow)
  NWell:
    color: [0.85, 0.65, 0.30, 0.55]

  # Fins - electric teal/cyan (hero nanostructures)
  Fin:
    color: [0.10, 0.80, 0.75, 0.90]

  # Active - neon green (thin active layer pop)
  Active:
    color: [0.20, 0.90, 0.40, 0.90]

  # Gate - deep violet/magenta (striking contrast)
  Gate:
    color: [0.50, 0.15, 0.80, 0.95]
    metallic: 0.8
    roughness: 0.3
  # Gate cut - bright white/ice (crisp negative space)
  GateCut:
    color: [0.90, 0.95, 1.00, 0.70]

  # SDT - vivid coral/orange (epitaxy highlight)
  SDT:
    color: [0.95, 0.45, 0.25, 0.90]

  # Local interconnects - rose gold gradient
  LIG:
    color: [0.90, 0.55, 0.40, 1.0]
    metallic: 0.8
  LISD:
    color: [0.88, 0.52, 0.38, 1.0]
    metallic: 0.8

  # Tungsten contacts - bright copper
  V0:
    color: [0.92, 0.58, 0.35, 1.0]
    metallic: 0.8

