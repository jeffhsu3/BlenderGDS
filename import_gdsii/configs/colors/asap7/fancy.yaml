name: Fancy
description: Fancy color scheme - vivid flat aesthetic
layers:
  # NWell - deep blue (substrate)
  NWell:
    color: [0.10, 0.30, 0.90, 0.65]
    metallic: 0.0
    roughness: 1.0

  # Fins - vivid cyan (hero FinFET nanostructures)
  Fin:
    color: [0.05, 0.90, 0.90, 0.90]
    metallic: 0.0
    roughness: 1.0

  # Active - bright green
  Active:
    color: [0.10, 0.95, 0.25, 0.90]
    metallic: 0.0
    roughness: 1.0

  # Gate - vivid red
  Gate:
    color: [0.95, 0.08, 0.08, 0.95]
    metallic: 0.0
    roughness: 1.0

  # Gate cut - bright white (crisp negative space)
  GateCut:
    color: [1.0, 1.0, 1.0, 0.70]
    metallic: 0.0
    roughness: 1.0

  # SDT - vivid orange (source/drain epitaxy)
  SDT:
    color: [1.0, 0.52, 0.05, 0.90]
    metallic: 0.0
    roughness: 1.0

  # Local interconnects - yellow-green (between gate-red and metal-blue)
  LIG:
    color: [0.75, 0.95, 0.10, 1.0]
    metallic: 0.0
    roughness: 1.0
  LISD:
    color: [0.65, 0.92, 0.10, 1.0]
    metallic: 0.0
    roughness: 1.0

  # Contacts & vias - bright white
  V0:
    color: [1.0, 1.0, 1.0, 1.0]
    metallic: 0.0
    roughness: 1.0

  # Metal layers - vivid rainbow spectrum (Blue → Violet → Red → Orange → Yellow → Chartreuse → Cyan → Pink → Gold)
  M1:
    color: [0.15, 0.40, 1.0, 1.0]        # Blue
    metallic: 0.0
    roughness: 1.0
  V1:
    color: [1.0, 1.0, 1.0, 1.0]
    metallic: 0.0
    roughness: 1.0

  M2:
    color: [0.55, 0.10, 1.0, 1.0]        # Violet
    metallic: 0.0
    roughness: 1.0
  V2:
    color: [1.0, 1.0, 1.0, 1.0]
    metallic: 0.0
    roughness: 1.0

  M3:
    color: [1.0, 0.08, 0.08, 1.0]        # Red
    metallic: 0.0
    roughness: 1.0
  V3:
    color: [1.0, 1.0, 1.0, 1.0]
    metallic: 0.0
    roughness: 1.0

  M4:
    color: [1.0, 0.52, 0.05, 1.0]        # Orange
    metallic: 0.0
    roughness: 1.0
  V4:
    color: [1.0, 1.0, 1.0, 1.0]
    metallic: 0.0
    roughness: 1.0

  M5:
    color: [1.0, 0.95, 0.05, 1.0]        # Yellow
    metallic: 0.0
    roughness: 1.0
  V5:
    color: [1.0, 1.0, 1.0, 1.0]
    metallic: 0.0
    roughness: 1.0

  M6:
    color: [0.40, 0.95, 0.08, 1.0]        # Chartreuse
    metallic: 0.0
    roughness: 1.0
  V6:
    color: [1.0, 1.0, 1.0, 1.0]
    metallic: 0.0
    roughness: 1.0

  M7:
    color: [0.05, 0.88, 0.88, 1.0]        # Cyan
    metallic: 0.0
    roughness: 1.0
  V7:
    color: [1.0, 1.0, 1.0, 1.0]
    metallic: 0.0
    roughness: 1.0

  M8:
    color: [1.0, 0.22, 0.68, 1.0]        # Pink
    metallic: 0.0
    roughness: 1.0
  V8:
    color: [1.0, 1.0, 1.0, 1.0]
    metallic: 0.0
    roughness: 1.0

  # Top metal - gold (bond-pad layer, visually distinct)
  M9:
    color: [1.0, 0.78, 0.10, 1.0]        # Gold
    metallic: 0.0
    roughness: 1.0
