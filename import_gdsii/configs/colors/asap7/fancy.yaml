name: Fancy
description: Fancy color scheme - vivid flat aesthetic
layers:
  # NWell - deep blue (substrate)
  NWell:
    Base Color: [0.10, 0.30, 0.90, 0.65]
    Metallic: 0.0
    Roughness: 1.0

  # Fins - vivid cyan (hero FinFET nanostructures)
  Fin:
    Base Color: [0.05, 0.90, 0.90, 0.90]
    Metallic: 0.0
    Roughness: 1.0

  # Active - vivid orange (raised epitaxial source/drain)
  Active:
    Base Color: [1.0, 0.52, 0.05, 0.90]
    Metallic: 0.0
    Roughness: 1.0

  # Gate - vivid red
  Gate:
    Base Color: [0.95, 0.08, 0.08, 0.95]
    Metallic: 0.0
    Roughness: 1.0

  # Gate cut - bright white (crisp negative space)
  GateCut:
    Base Color: [1.0, 1.0, 1.0, 0.70]
    Metallic: 0.0
    Roughness: 1.0

  # SDT - magenta (trench silicide on the epi)
  SDT:
    Base Color: [0.90, 0.15, 0.65, 1.0]
    Metallic: 0.0
    Roughness: 1.0

  # LIG - yellow-green (local interconnect to gate)
  LIG:
    Base Color: [0.75, 0.95, 0.10, 1.0]
    Metallic: 0.0
    Roughness: 1.0
  # LISD - warm amber (local interconnect to source/drain)
  LISD:
    Base Color: [0.95, 0.75, 0.10, 1.0]
    Metallic: 0.0
    Roughness: 1.0

  # Contacts & vias - bright white
  V0:
    Base Color: [1.0, 1.0, 1.0, 1.0]
    Metallic: 0.0
    Roughness: 1.0

  # Metal layers - vivid rainbow spectrum
  # (Blue → Violet → Red → Orange → Yellow → Chartreuse → Cyan → Pink → Gold)
  M1:
    Base Color: [0.15, 0.40, 1.0, 1.0]        # Blue
    Metallic: 0.0
    Roughness: 1.0
  V1:
    Base Color: [1.0, 1.0, 1.0, 1.0]
    Metallic: 0.0
    Roughness: 1.0

  M2:
    Base Color: [0.55, 0.10, 1.0, 1.0]        # Violet
    Metallic: 0.0
    Roughness: 1.0
  V2:
    Base Color: [1.0, 1.0, 1.0, 1.0]
    Metallic: 0.0
    Roughness: 1.0

  M3:
    Base Color: [1.0, 0.08, 0.08, 1.0]        # Red
    Metallic: 0.0
    Roughness: 1.0
  V3:
    Base Color: [1.0, 1.0, 1.0, 1.0]
    Metallic: 0.0
    Roughness: 1.0

  M4:
    Base Color: [1.0, 0.52, 0.05, 1.0]        # Orange
    Metallic: 0.0
    Roughness: 1.0
  V4:
    Base Color: [1.0, 1.0, 1.0, 1.0]
    Metallic: 0.0
    Roughness: 1.0

  M5:
    Base Color: [1.0, 0.95, 0.05, 1.0]        # Yellow
    Metallic: 0.0
    Roughness: 1.0
  V5:
    Base Color: [1.0, 1.0, 1.0, 1.0]
    Metallic: 0.0
    Roughness: 1.0

  M6:
    Base Color: [0.40, 0.95, 0.08, 1.0]        # Chartreuse
    Metallic: 0.0
    Roughness: 1.0
  V6:
    Base Color: [1.0, 1.0, 1.0, 1.0]
    Metallic: 0.0
    Roughness: 1.0

  M7:
    Base Color: [0.05, 0.88, 0.88, 1.0]        # Cyan
    Metallic: 0.0
    Roughness: 1.0
  V7:
    Base Color: [1.0, 1.0, 1.0, 1.0]
    Metallic: 0.0
    Roughness: 1.0

  M8:
    Base Color: [1.0, 0.22, 0.68, 1.0]        # Pink
    Metallic: 0.0
    Roughness: 1.0
  V8:
    Base Color: [1.0, 1.0, 1.0, 1.0]
    Metallic: 0.0
    Roughness: 1.0

  # Top metal - gold (bond-pad layer, visually distinct)
  M9:
    Base Color: [1.0, 0.78, 0.10, 1.0]        # Gold
    Metallic: 0.0
    Roughness: 1.0
