name: Marketing (Gold)
description: Marketing color scheme with gold
layers:
  # Silicon / Devices
  NWell:
    Base Color: [0.30, 0.50, 1.00, 0.75]

  Fin:
    Base Color: [0.20, 0.80, 0.30, 0.85]

  # Raised epitaxial source/drain - warm amber
  Active:
    Base Color: [0.95, 0.60, 0.20, 0.85]

  Gate:
    Base Color: [1.00, 0.30, 0.30, 0.90]
    Metallic: 0.8
    Roughness: 0.3
  # Gate cut - cool blue-white oxide
  GateCut:
    Base Color: [0.78, 0.88, 0.98, 0.65]

  # SDT - trench silicide, deep bronze
  SDT:
    Base Color: [0.72, 0.52, 0.22, 1.0]
    Metallic: 0.85

  # LIG - rose gold (local interconnect to gate)
  LIG:
    Base Color: [0.98, 0.72, 0.38, 1.0]
    Metallic: 0.8
  # LISD - yellow gold (local interconnect to source/drain)
  LISD:
    Base Color: [0.92, 0.88, 0.22, 1.0]
    Metallic: 0.8

  V0:
    Base Color: [0.98, 0.78, 0.26, 1.0]
    Metallic: 0.8

