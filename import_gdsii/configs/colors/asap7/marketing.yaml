name: Marketing
description: Marketing color scheme
layers:
  # Silicon / Devices (enhanced but plausible)
  NWell:
    Base Color: [0.30, 0.40, 0.55, 0.55]

  Fin:
    Base Color: [0.25, 0.40, 0.22, 0.90]

  # Raised epitaxial source/drain - warm amber-brown
  Active:
    Base Color: [0.60, 0.38, 0.22, 0.90]

  # Metal gate - dark charcoal metallic
  Gate:
    Base Color: [0.18, 0.18, 0.16, 0.95]
    Metallic: 0.85
    Roughness: 0.3
  # Gate cut - clean light oxide
  GateCut:
    Base Color: [0.80, 0.86, 0.90, 0.60]

  # SDT - trench silicide, pale tungsten
  SDT:
    Base Color: [0.52, 0.54, 0.57, 1.0]
    Metallic: 0.8

  # LIG - cool dark tungsten (local interconnect to gate)
  LIG:
