name: Realistic
description: Realistic color scheme
layers:
  # N-well - muted blue-gray (n-doped silicon)
  NWell:
    Base Color: [0.25, 0.35, 0.50, 0.60]

  # Silicon fins - greenish silicon gray
  Fin:
    Base Color: [0.22, 0.35, 0.20, 0.90]

  # Raised epitaxial source/drain (SiGe) - orange-brown
  Active:
    Base Color: [0.55, 0.35, 0.20, 0.90]

  # Metal gate stack (TiN/HfO2) - near-black metallic
  Gate:
    Base Color: [0.15, 0.15, 0.15, 0.95]
    Metallic: 0.9
    Roughness: 0.3
  # Gate cut (dielectric fill / STI) - translucent pale oxide
  GateCut:
    Base Color: [0.82, 0.88, 0.92, 0.60]

  # Source/drain trench silicide (Ti/W) - cool metallic
  SDT:
    Base Color: [0.38, 0.40, 0.43, 1.0]
    Metallic: 0.8

  # Local interconnect to gate (Co/W) - cool dark metallic
  LIG:
    Base Color: [0.32, 0.35, 0.40, 1.0]
    Metallic: 0.8

  # Local interconnect to source/drain (Co/W) - warm dark metallic
  LISD:
    Base Color: [0.42, 0.38, 0.34, 1.0]
    Metallic: 0.8

  # Tungsten contacts (V0)
  V0:
    Base Color: [0.40, 0.42, 0.44, 1.0]
    Metallic: 0.8

  # Local copper metals (M1-M3) - warm copper tones
  M1:
    Base Color: [0.72, 0.45, 0.20, 1.0]
    Metallic: 0.9
    Roughness: 0.2
  V1:
    Base Color: [0.55, 0.38, 0.18, 1.0]
    Metallic: 0.8

  M2:
    Base Color: [0.74, 0.47, 0.22, 1.0]
    Metallic: 0.9
    Roughness: 0.2
  V2:
    Base Color: [0.57, 0.40, 0.20, 1.0]
    Metallic: 0.8

  M3:
    Base Color: [0.76, 0.49, 0.24, 1.0]
    Metallic: 0.9
    Roughness: 0.2
  V3:
    Base Color: [0.59, 0.42, 0.22, 1.0]
    Metallic: 0.8

  # Intermediate copper metals (M4-M6)
  M4:
    Base Color: [0.78, 0.52, 0.26, 1.0]
    Metallic: 0.85
    Roughness: 0.25
  V4:
    Base Color: [0.61, 0.44, 0.24, 1.0]
    Metallic: 0.8

  M5:
    Base Color: [0.80, 0.55, 0.28, 1.0]
    Metallic: 0.85
    Roughness: 0.25
  V5:
    Base Color: [0.63, 0.46, 0.26, 1.0]
    Metallic: 0.8

  M6:
    Base Color: [0.82, 0.58, 0.30, 1.0]
    Metallic: 0.85
    Roughness: 0.25
  V6:
    Base Color: [0.65, 0.48, 0.28, 1.0]
    Metallic: 0.8

  # Global copper metals (M7-M9) - thicker, brighter copper
  M7:
    Base Color: [0.84, 0.61, 0.32, 1.0]
    Metallic: 0.85
    Roughness: 0.2
  V7:
    Base Color: [0.67, 0.50, 0.30, 1.0]
    Metallic: 0.8

  M8:
    Base Color: [0.86, 0.64, 0.34, 1.0]
    Metallic: 0.85
    Roughness: 0.2
  V8:
    Base Color: [0.69, 0.52, 0.32, 1.0]
    Metallic: 0.8

  M9:
    Base Color: [0.88, 0.67, 0.36, 1.0]
    Metallic: 0.85
    Roughness: 0.2
