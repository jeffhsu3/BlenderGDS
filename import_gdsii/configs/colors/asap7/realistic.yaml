name: Realistic
description: Realistic color scheme
layers:
  # N-well - muted blue-gray (n-doped silicon)
  NWell:
    color: [0.25, 0.35, 0.50, 0.60]

  # Silicon fins - greenish silicon gray
  Fin:
    color: [0.22, 0.35, 0.20, 0.90]

  # Active region - slightly brighter silicon green
  Active:
    color: [0.30, 0.45, 0.25, 0.90]

  # Metal gate stack (TiN/HfO2) - near-black metallic
  Gate:
    color: [0.15, 0.15, 0.15, 0.95]
    metallic: 0.9
    roughness: 0.3

  # Source/drain trench (SiGe epitaxy) - orange-brown
  SDT:
    color: [0.55, 0.35, 0.20, 0.90]

  # Local interconnect to gate (Co/W) - dark metallic
  LIG:
    color: [0.35, 0.36, 0.38, 1.0]
    metallic: 0.8

  # Local interconnect to source/drain (Co/W)
  LISD:
    color: [0.38, 0.40, 0.42, 1.0]
    metallic: 0.8

  # Tungsten contacts (V0)
  V0:
    color: [0.40, 0.42, 0.44, 1.0]
    metallic: 0.8

  # Local copper metals (M1-M3) - warm copper tones
  M1:
    color: [0.72, 0.45, 0.20, 1.0]
    metallic: 0.9
    roughness: 0.2
  V1:
    color: [0.55, 0.38, 0.18, 1.0]
    metallic: 0.8

  M2:
    color: [0.74, 0.47, 0.22, 1.0]
    metallic: 0.9
    roughness: 0.2
  V2:
    color: [0.57, 0.40, 0.20, 1.0]
    metallic: 0.8

  M3:
    color: [0.76, 0.49, 0.24, 1.0]
    metallic: 0.9
    roughness: 0.2
  V3:
    color: [0.59, 0.42, 0.22, 1.0]
    metallic: 0.8

  # Intermediate copper metals (M4-M6)
  M4:
    color: [0.78, 0.52, 0.26, 1.0]
    metallic: 0.85
    roughness: 0.25
  V4:
    color: [0.61, 0.44, 0.24, 1.0]
    metallic: 0.8

  M5:
    color: [0.80, 0.55, 0.28, 1.0]
    metallic: 0.85
    roughness: 0.25
  V5:
    color: [0.63, 0.46, 0.26, 1.0]
    metallic: 0.8

  M6:
    color: [0.82, 0.58, 0.30, 1.0]
    metallic: 0.85
    roughness: 0.25
  V6:
    color: [0.65, 0.48, 0.28, 1.0]
    metallic: 0.8

  # Global copper metals (M7-M9) - thicker, brighter copper
  M7:
    color: [0.84, 0.61, 0.32, 1.0]
    metallic: 0.85
    roughness: 0.2
  V7:
    color: [0.67, 0.50, 0.30, 1.0]
    metallic: 0.8

  M8:
    color: [0.86, 0.64, 0.34, 1.0]
    metallic: 0.85
    roughness: 0.2
  V8:
    color: [0.69, 0.52, 0.32, 1.0]
    metallic: 0.8

  M9:
    color: [0.88, 0.67, 0.36, 1.0]
    metallic: 0.85
    roughness: 0.2
