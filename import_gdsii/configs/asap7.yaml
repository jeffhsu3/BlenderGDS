#
# ASAP7 7nm FinFET Research PDK
# Z-stack derived from ASAP7_for_KLayout/asap7.lyt, in physical µm.
#
# These z values expect a GDS whose XY is also physical µm, which is what the
# default Unit Scale of 1e-6 gives. A 1x layout then lines up with the stack:
# a 7 nm fin stands 29 nm tall, gates are 20 nm long on a 54 nm pitch.
#
# The ASU releases of ASAP7 are drawn 4x oversized (DATABASE MICRONS 4000).
# Those need Unit Scale 4e-6 in the import dialog, which scales XY back down
# onto this stack. Do not scale the z values here instead — that would break
# every 1x layout.
#
# GDS layer/datatype from ASAP7 PDK GDS files

pdk_config:
  name: ASAP7 7nm FinFET PDK
  description: ASAP7 7nm FinFET research PDK
  def_color: realistic

NWell:
  index: 1
  type: 0
  z: -0.1
  height: 0.1

Fin:
  index: 2
  type: 0
  z: 0.0
  height: 0.029

# Raised epitaxial source/drain, abstracted. ASAP7 has no layer for the epi, so
# the active region stands in for it: everything the gate does not cover is
# where the epi grows, filling the gap between the fin tops and the trench
# contacts above. Starting just inside the fin tops merges the two instead of
# leaving coplanar faces that flicker in a render.
Active:
  index: 11
  type: 0
  z: 0.027
  height: 0.042
  cut_by:
    - Gate

Gate:
  index: 7
  type: 0
  z: 0.03
  height: 0.056
  cut_by:
    - GateCut
  wrap_around:
    layer: Fin
    z_extend: 0.01  # extend this far below the fin base into the STI/substrate

GateCut:
  index: 10
  type: 0
  z: 0.03
  height: 0.056

