# ASAP7 7nm FinFET Research PDK
# Z-stack derived from ASAP7_for_KLayout/asap7.lyt (physical µm values).
# gdstk reads GDS with unit=1e-6, converting all XY coordinates to physical µm
# regardless of ASAP7's 4x GDS scaling (DATABASE MICRONS 4000), so z values
# here are kept at true physical scale to match.
# GDS layer/datatype from ASAP7 PDK GDS files

